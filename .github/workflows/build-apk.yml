name: Build APK

on:
  push:
    branches: ["pre/APK"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Isi mis. v1.0.0 untuk membuat Release stable. Kosongkan = hanya build artifact."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependensi
        run: npm install

      - name: Build web
        run: npm run build

      - name: Tambah platform Android
        run: npx cap add android

      - name: Sinkron web ke Android
        run: npx cap sync android

      - name: Build APK Debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Tentukan versi
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          V="$INPUT_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/}"; fi
          NAME="${V:-${GITHUB_SHA::7}}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Rapikan nama APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/MafoyoThink-${{ steps.ver.outputs.name }}.apk"

      - name: Upload ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MafoyoThink-APK-${{ steps.ver.outputs.name }}
          path: out/*.apk

      - name: Buat GitHub Release (hanya jika ada versi)
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: MafoyoThink ${{ steps.ver.outputs.version }}
          files: out/*.apk
